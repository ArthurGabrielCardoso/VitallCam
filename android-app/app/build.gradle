plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vitallcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.vitallcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // O OpenCV traz .so por arquitetura. Sem filtro o APK carregaria x86 e
        // x86_64, que so servem a emulador — a box e o tablet da recepcao sao
        // ARM. Recorta tambem os nativos do UVCAndroid, entao o APK encolhe.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'

    // Jetpack Compose — UI declarativa pra replicar o design web pixel-a-pixel
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime'

    // UVCAndroid (shiyinghan) - Maven Central, suporte a câmera UVC via OTG
    implementation 'com.herohan:UVCAndroid:1.0.13'

    // CameraX — camera traseira do tablet pro scanner de documentos.
    // 1.3.4 e a ultima linha que acompanha compileSdk 34; as 1.5+ exigem 35.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // A camera grava a orientacao no EXIF em vez de girar os pixels; sem ler
    // isso o documento chega deitado na deteccao de bordas.
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // OpenCV — deteccao de bordas, correcao de perspectiva e remocao de sombra
    // do scanner. Oficial no Maven Central desde a 4.9.0.
    implementation 'org.opencv:opencv:4.9.0'

    // WebViewAssetLoader — serve arquivos do cache via https://appassets.androidplatform.net/...
    // pra contornar limite de Binder IPC (1MB) ao transferir capturas grandes pro JS
    implementation 'androidx.webkit:webkit:1.10.0'
}
